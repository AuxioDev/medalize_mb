name: medalize_mb
description: "DocGet mobile application."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.0.0
  flutter_secure_storage: ^9.0.0
  go_router: ^14.0.0
  flutter_riverpod: ^2.0.0
  table_calendar: ^3.1.0
  cached_network_image: ^3.3.0
  intl: ^0.20.2
  image_picker: ^1.1.0
  file_picker: ^8.1.2
  # Compresses camera-shot photos before uploading them as medical records —
  # image_picker's imageQuality (used for avatars) doesn't apply here since
  # records also accept PDFs via file_picker, which has no compression option.
  flutter_image_compress: ^2.5.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  slang: ^4.4.0
  slang_flutter: ^4.4.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^18.0.0
  # Promoted from a transitive dependency (pulled in by
  # flutter_local_notifications) to direct: medication reminders need
  # tz.initializeTimeZones()/setLocalLocation() and TZDateTime directly (see
  # lib/core/services/medication_scheduler.dart).
  timezone: ^0.10.1
  # Resolves the device's IANA timezone name for local dose-reminder scheduling.
  flutter_timezone: ^5.1.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  local_auth: ^3.0.1
  device_info_plus: ^12.4.0
  geolocator: ^14.0.0
  permission_handler: ^12.0.0
  # Opens an uploaded medical record's signed Cloudinary URL in an external
  # viewer/browser (records feature — no in-app PDF viewer in this phase).
  url_launcher: ^6.3.2
  # Native "Share" sheet — doctor/hospital profile share links
  # (QR_SHARE_PROFILE_PLAN.md Phase 2).
  # Pinned to the 12.x line (not the newest 13.x): 13.x bumps its Windows
  # dependency (win32 ^6.0.1) past what device_info_plus ^12.4.0 allows
  # (win32 ^5.11.0), which `flutter pub get` refuses to resolve.
  share_plus: ^12.0.2
  # Generates the Privacy Policy/Terms PDF shown in-app at registration and
  # from Settings > Legal (see lib/features/shared/data/legal_pdf_builder.dart).
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  # Renders the QR code shown in the doctor/hospital "share profile" sheet
  # (encodes the same medalize_web share link as the native share sheet).
  qr_flutter: ^4.1.0
  # Universal Links (iOS) / App Links (Android) — opens a doctor/hospital
  # share link straight into the app instead of the medalize_web preview
  # page, once installed (QR_SHARE_PROFILE_PLAN.md Phase 3). Separate from
  # the existing medalize:// custom scheme, which stays payment-only.
  app_links: ^7.2.1
  # Crash reporting — disabled unless SENTRY_DSN is supplied via
  # --dart-define at build time (see lib/main.dart); an empty DSN is a
  # documented no-op in the SDK, so no separate on/off gate is needed here.
  sentry_flutter: ^9.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: MockPlatformInterfaceMixin, used to fake FilePicker.platform in
  # test/upload_record_screen_test.dart without a real platform channel.
  plugin_platform_interface: ^2.1.8
  # Test-only: SharePlatform, used to fake the native share sheet in
  # test/conversation_summary_screen_test.dart without a real platform channel.
  share_plus_platform_interface: ^6.1.0
  # Test-only: FlutterImageCompressPlatform, used to fake image compression in
  # test/upload_record_screen_test.dart without a real platform channel.
  flutter_image_compress_platform_interface: ^1.1.0
  slang_build_runner: ^4.4.0
  build_runner: ^2.4.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # Runtime use of the brand mark (splash screen, auth headers) — the
  # transparent foreground-only layer, not the launcher-icon composites
  # (app_icon.png/app_icon_bg.png stay build-time-only, consumed by
  # flutter_launcher_icons below).
  assets:
    - assets/icon/app_icon_fg.png

# App launcher icon. Source art: assets/icon/source/app_icon_source.svg
# (medal + medical cross mark). Regenerate after editing the source SVGs:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
